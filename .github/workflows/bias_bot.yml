name: Bias bot
on:
  schedule:
    - cron: "*/5 8-10 * * 1-5"
    - cron: "2,17,32,47 11-17 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send all 7 briefs now (testing)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: smc_bias_bot

permissions:
  contents: write

concurrency:
  group: bias-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install tvdatafeed-enhanced || pip install git+https://github.com/rongardF/tvdatafeed.git
      - name: Run bias bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: python main.py
      - name: Save state
        run: |
          git config user.name "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
